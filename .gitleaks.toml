# Правила пошуку секретів для цього репозиторію.
#
# Типовий набір gitleaks знає AWS, GitHub, Stripe і ще сотню провайдерів, але
# не знає двох речей, які тут найцінніші. Тому доповнюємо, а не замінюємо.

[extend]
useDefault = true

# Токен Telegram-бота — головний секрет цього проєкту. Хто його має, той шле
# повідомлення від імені бота в групу з заявками. У типовому наборі правила
# для нього немає (перевірено на gitleaks 8.30).
[[rules]]
id = "telegram-bot-token"
description = "Токен Telegram-бота"
regex = '''[0-9]{8,10}:AA[A-Za-z0-9_-]{33}'''

# Адреса розгорнутого Apps Script. Формально це URL, а по суті — ключ: Google
# тримає його відкритим для всіх, тож донедавна знання адреси й було доступом
# на запис у таблицю з лідами. Зараз її прикриває ще й SHEET_SECRET, але сама
# адреса лишається тим, що не має лежати в коді.
[[rules]]
id = "google-apps-script-exec-url"
description = "Адреса розгорнутого Apps Script (/exec)"
regex = '''https://script\.google\.com/macros/s/[A-Za-z0-9_-]{30,}/exec'''

[allowlist]
description = "Те, що виглядає як секрет, але ним не є"
paths = [
  # Хеші цілісності sha512-… мають високу ентропію і регулярно дають хибні
  # спрацювання. Вміст лок-файлів генерує пакетний менеджер, не людина.
  '''pnpm-lock\.yaml$''',
]
