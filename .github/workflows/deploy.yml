name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node ставимо першим: setup-node з cache: pnpm запускав pnpm ще до того,
      # як версія Node перемкнеться, і крок падав. Кеш прибрано — він економив
      # секунди, а коштував усього викочування.
      - uses: actions/setup-node@v4
        with:
          # pnpm 11 вимагає Node >= 22.13 — на Node 20 install падав одразу.
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.2

      - run: pnpm install --frozen-lockfile

      - name: Install Chrome for prerender
        run: pnpm exec puppeteer browsers install chrome

      - name: Build
        run: pnpm build
        env:
          FIGMA_PUBLIC_URL: /${{ github.event.repository.name }}
          # Адреса Worker, який пересилає заявки в Telegram. Задається у
          # Settings → Secrets and variables → Actions → Variables.
          # Порожня змінна означає, що форма чесно покаже помилку з телефоном,
          # а не вдаватиме, ніби заявку прийнято.
          VITE_LEAD_ENDPOINT: ${{ vars.VITE_LEAD_ENDPOINT }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
