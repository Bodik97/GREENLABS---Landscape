name = "greenlabs-leads"
main = "index.js"
compatibility_date = "2026-08-01"

# Домени, з яких приймаємо форму. Запит із будь-якого іншого джерела браузер
# заблокує сам. Після переїзду на власний домен допишіть його сюди першим.
[vars]
# localhost — щоб форму можна було перевіряти на сервері розробки. Захисту це
# не послаблює: заголовок Origin дотримує браузер, а не зловмисник — підробити
# його зі скрипта можна й так. Справжній захист тут — валідація, пастка і ліміт.
ALLOWED_ORIGINS = "https://greenlabs-one.vercel.app,http://localhost:8443,http://localhost:5173"

# Сховище для обмеження частоти заявок з однієї адреси.
[[kv_namespaces]]
binding = "LEADS_KV"
id = "f7e21be8b1784725864440a2e9d0d329"

# BOT_TOKEN, CHAT_ID, SHEET_URL і SHEET_SECRET сюди НЕ пишемо — вони задаються
# як секрети:
#   npx wrangler secret put BOT_TOKEN
#   npx wrangler secret put CHAT_ID
#   npx wrangler secret put SHEET_URL
#   npx wrangler secret put SHEET_SECRET
